[project]
name = "cleared-to-call"
version = "0.1.0"
description = "A consent-and-compliance gate that decides whether an outbound collection call is allowed to happen."
requires-python = ">=3.11"
# The gate itself (cleared/) needs only the standard library plus a timezone
# database. The web dependencies live here rather than in an extra because the
# deployment host installs this list, and an optional extra it does not know to
# ask for is how the deployed function came to crash on import.
dependencies = [
  "tzdata>=2024.1",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
demo = [
  "uvicorn>=0.27",
]
live = [
  "fastmcp>=3.2,<4",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
cleared-to-call = "cleared.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cleared"]

[tool.setuptools.package-data]
cleared = ["policy.json"]

[tool.vercel]
# demo/entry.py puts the repository root on sys.path and reports any import
# failure as a readable page rather than an opaque 500.
entrypoint = "demo.entry:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
